services:
  postgres:
    image: postgres:15-alpine
    container_name: zerodha-itms-postgres
    restart: unless-stopped
    env_file:
      - .env
      - .env.secrets
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-itms}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d itms"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zerodha-itms-backend
    restart: unless-stopped
    user: "${ITMS_BACKEND_USER:-1000:1000}"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
      - .env.secrets
      - ${ITMS_DATABASE_ENV_FILE:-${HOME}/.config/itms/backend-database.env}
    environment:
      MIGRATION_DIR: /app/db/postgres_migrations
      BACKEND_ADDR: :3001
      # Keycloak SSO configuration
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-itms}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-itms-backend}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ${SSH_TERMINAL_PRIVATE_KEY_HOST_PATH:-/home/itms/.config/itms/ssh_terminal}:/run/secrets/itms_ssh_key:ro
      - ../scripts:/app/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
